name: Mirror

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pics
            source_secret: PICS_FROM
            target_secret: PICS_TO
          - name: hd-arts
            source_secret: HDARTS_FROM
            target_secret: HDARTS_TO
          - name: irrlicht
            source_secret: IRRLICHT_FROM
            target_secret: IRRLICHT_TO

    name: Mirror ${{ matrix.name }}
    steps:
      - name: Git Config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Restore mirror cache
        uses: actions/cache/restore@v4
        with:
          path: repo.git
          key: mirror-${{ matrix.name }}

      - name: Mirror repository
        env:
          SOURCE_REPO: ${{ secrets[matrix.source_secret] }}
          TARGET_REPO: ${{ secrets[matrix.target_secret] }}
        run: |
          if [ -d repo.git ]; then
            cd repo.git
            git remote set-url origin "$SOURCE_REPO"
            git remote update --prune
          else
            git clone --mirror "$SOURCE_REPO" repo.git
            cd repo.git
          fi

          git remote set-url --push origin "$TARGET_REPO"

          git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > /tmp/local.refs
          git ls-remote "$TARGET_REPO" 'refs/heads/*' 'refs/tags/*' | awk '{print $1 " " $2}' | sort > /tmp/remote.refs

          if cmp -s /tmp/local.refs /tmp/remote.refs; then
            echo "repo_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "repo_changed=true" >> $GITHUB_OUTPUT
          git push --mirror

      - name: Install Rust
        if: ${{ matrix.source_secret == 'HDARTS_FROM' && steps.check.outputs.repo_changed == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Restore mirror cache
        if: ${{ matrix.source_secret == 'HDARTS_FROM' && steps.check.outputs.repo_changed == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: GetDeck/core-wasm/target/release
          key: GetDeck

      - name: Hashing hdarts
        if: ${{ matrix.source_secret == 'HDARTS_FROM' && steps.check.outputs.repo_changed == 'true' }}
        run: |
          git clone git@github.com:jwyxym/GetDeck.git --depth 1
          cd GetDeck/core-wasm
          wget https://github.com/mycard/ygopro-database/raw/refs/heads/master/locales/zh-CN/cards.cdb
          cargo run --release ../../repo.git/arts cards.cdb ../public/card_data
          git add ../public/card_data
          git commit -m "update card_data"
          git push

      - name: Clean cached remotes
        run: |
          git -C repo.git remote set-url origin https://example.invalid/source.git
          git -C repo.git remote set-url --push origin https://example.invalid/target.git

      - name: Delete previous mirror cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete "mirror-${{ matrix.name }}" || true

      - name: Save rust cache
        if: ${{ matrix.source_secret == 'HDARTS_FROM' && steps.check.outputs.repo_changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: GetDeck/core-wasm/target/release
          key: GetDeck

      - name: Save mirror cache
        uses: actions/cache/save@v4
        with:
          path: repo.git
          key: mirror-${{ matrix.name }}
