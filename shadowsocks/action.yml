name: ShadowSocks
description: ShadowSocks Proxy on 127.0.0.1

inputs:
  ss_server:
    description: ShadowSocks server address
    required: true
  ss_server_port:
    description: ShadowSocks server port
    required: true
  ss_pass:
    description: ShadowSocks password
    required: true
  ss_method:
    description: ShadowSocks method (such as aes-256-gcm, 2022-blake3-aes-256-gcm)
    required: false
    default: aes-256-gcm
  ss_port:
    description: ShadowSocks port
    required: false
    default: 1081

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Prepare
      shell: bash
      run: |
        npm i pm2 -g
        git clone https://github.com/shadowsocks/shadowsocks-rust.git --depth 1

    - name: Run
      shell: bash
      run: |
        cd shadowsocks-rust
        cargo build --release --bin sslocal
        pm2 start cargo --name ss -- \
          run --release --bin sslocal -- \
          -s "${{ inputs.ss_server }}:${{ inputs.ss_server_port }}" \
          -k "${{ inputs.ss_pass }}" \
          -m "${{ inputs.ss_method }}" \
          -b "127.0.0.1:${{ inputs.ss_port }}"