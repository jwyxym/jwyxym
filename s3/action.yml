name: Upload to S3 bucket
description: Install boto3 and upload artifacts via .ci/update_ygopro3.py

inputs:
  s3_endpoint:
    description: S3 endpoint
    required: true
  access_key:
    description: S3 access key
    required: true
  secret_key:
    description: S3 secret key
    required: true
  bucket:
    description: target bucket
    required: true
  file_name:
    description: file name
    required: true
  file_path:
    description: file path
    required: true
  content_type:
    description: content_type (default application/octet-stream)
    required: false
    default: application/octet-stream
  proxy:
    description: proxy url
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Create venv and install deps
      shell: bash
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install --quiet boto3

    - name: Upload to Bucket
      shell: bash
      run: |
        proxy="${{ inputs.proxy }}"
        if [[ "$proxy" =~ ^https?:// ]]; then
          export HTTP_PROXY="$proxy"
          export HTTPS_PROXY="$proxy"
          export http_proxy="$proxy"
          export https_proxy="$proxy"
        elif [[ "$proxy" =~ ^socks5:// ]]; then
          export HTTP_PROXY="$proxy"
          export HTTPS_PROXY="$proxy"
          export http_proxy="$proxy"
          export https_proxy="$proxy"
        fi
        source .venv/bin/activate
        python "$GITHUB_ACTION_PATH/s3.py" \
          "${{ inputs.s3_endpoint }}" \
          "${{ inputs.access_key }}" \
          "${{ inputs.secret_key }}" \
          "${{ inputs.bucket }}" \
          "${{ inputs.file_name }}" \
          "${{ inputs.file_path }}" \
          "${{ inputs.content_type }}"